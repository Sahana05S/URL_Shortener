services:
  - type: web
    name: linkora
    runtime: node
    plan: free
    buildCommand: npm ci && npm run check && npm audit --audit-level=high
    startCommand: npm run db:deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: IP_HASH_SECRET
        generateValue: true
